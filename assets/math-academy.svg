  <text x="45" y="124" fill="#effaf5" font-size="61" font-weight="700" letter-spacing="-2">Math Academy</text>
  <text x="48" y="166" fill="#a1c6c4" font-size="21">Content, clarity &amp; a little curiosity.</text>
  <path d="M48 201h510" stroke="#5eead4" stroke-opacity=".16"/>
  <text x="48" y="237" fill="#99c9c1" font-size="13" letter-spacing=".6">PUBLISHING</text><text x="160" y="237" fill="#577b7e" font-size="14">/</text>
  <text x="183" y="237" fill="#99c9c1" font-size="13" letter-spacing=".6">MANAGED DATA</text><text x="327" y="237" fill="#577b7e" font-size="14">/</text>
  <text x="350" y="237" fill="#99c9c1" font-size="13" letter-spacing=".6">INTERACTION</text>
  <rect x="779" y="29" width="430" height="224" rx="13" fill="url(#grid)"/>
  <path d="M810 216h361m-326 20V50" fill="none" stroke="#7aaba9" stroke-opacity=".3"/>
  <circle cx="1020" cy="143" r="87" fill="none" stroke="#5eead4" stroke-opacity=".17" class="trace"/>
  <path d="M866 211h233V75Z" fill="#5eead4" fill-opacity=".025" stroke="#96e4d5" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M1081 211v-18h18" fill="none" stroke="#dac493" stroke-width="1.5"/>
  <path d="M878 209q55-97 126-41t149-55" fill="none" stroke="#5eead4" stroke-opacity=".25" stroke-width="2"/>
