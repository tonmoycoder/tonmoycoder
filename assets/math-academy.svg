<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
  <title id="title">Math Academy — Bengali-first education and content</title>
  <desc id="desc">Original project illustration, not an application screenshot. A triangle, circle and coordinate lines illustrate curiosity and visual learning; the project combines Bengali content, a publishing pipeline and managed batch information.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b2029"/><stop offset="1" stop-color="#102b2d"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#5eead4" stop-opacity=".1"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#99f6e4" stroke-opacity=".055" fill="none"/></pattern>
    <style>text{font-family:Inter,'Segoe UI',Arial,sans-serif}.trace{stroke-dasharray:4 9;animation:trace 25s linear infinite}.point{animation:pulse 5s ease-in-out infinite}@keyframes trace{to{stroke-dashoffset:-130}}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.trace,.point{animation:none!important}}</style>
  </defs>
  <rect width="1280" height="280" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="278" rx="19" fill="none" stroke="#5eead4" stroke-opacity=".2"/>
  <ellipse cx="1030" cy="129" rx="270" ry="147" fill="url(#aura)"/>
