<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="title desc">
  <title id="title">Tanver Islam Tonmoy — full-stack developer and UI/UX designer</title>
  <desc id="desc">Mobile composition of the original profile banner. Useful software, considered interfaces. Bangladesh, UTC+6. Open to engineering opportunities. Decorative animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#7c3aed" stop-opacity=".29"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink"><stop stop-color="#fafbff"/><stop offset=".55" stop-color="#e9dfff"/><stop offset="1" stop-color="#b4eeff"/></linearGradient>
    <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#a78bfa" stop-opacity=".6"/><stop offset="1" stop-color="#67e8f9" stop-opacity=".3"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity=".065"/></pattern>
    <style>
      text{font-family:Inter,'Segoe UI',Arial,sans-serif}
      .mono{font-family:Consolas,'Liberation Mono',monospace}
      .signal{animation:signal 4s ease-in-out infinite}
      .float{animation:float 8s ease-in-out infinite}
      @keyframes signal{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @media(prefers-reduced-motion:reduce){.signal,.float{animation:none!important}}
    </style>
  </defs>
  <rect width="720" height="770" rx="25" fill="url(#bg)"/>
  <rect width="720" height="770" rx="25" fill="url(#grid)"/>
  <ellipse cx="160" cy="180" rx="330" ry="290" fill="url(#aura)"/>
  <rect x="1" y="1" width="718" height="768" rx="24" fill="none" stroke="url(#edge)"/>
  <path d="M45 47h26m-13 0v23" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
  <text x="84" y="64" fill="#d4d9e9" font-size="16" font-weight="600" letter-spacing="2.5">TONMOY / LAB</text>
  <text x="46" y="126" fill="#a78bfa" font-size="15" font-weight="600" letter-spacing="2">FULL-STACK DEVELOPER / UI·UX</text>
  <text x="41" y="224" fill="url(#ink)" font-size="80" font-weight="750" letter-spacing="-3">Tanver Islam</text>
  <text x="39" y="324" fill="url(#ink)" font-size="108" font-weight="800" letter-spacing="-5">Tonmoy.</text>
  <text x="46" y="388" fill="#eef2ff" font-size="29" font-weight="500">I build useful software.</text>
  <text x="46" y="428" fill="#a3adc6" font-size="25">With a designer's eye for the details.</text>
  <rect x="46" y="466" width="349" height="49" rx="11" fill="#34d399" fill-opacity=".07" stroke="#34d399" stroke-opacity=".3"/>
  <circle cx="70" cy="490.5" r="5" fill="#6ee7b7" class="signal"/>
  <text x="90" y="497" fill="#b0efda" font-size="18">Open to engineering opportunities</text>
  <text x="46" y="552" fill="#a3adc6" font-size="18">Bangladesh · UTC+6</text>
  <g class="float">
    <rect x="46" y="591" width="628" height="122" rx="17" fill="#0e1529" stroke="url(#edge)"/>
    <path d="m89 620 21 12v25l-21 12-21-12v-25Z" fill="#a78bfa" fill-opacity=".09" stroke="#c4b5fd" stroke-width="1.5"/>
    <circle cx="89" cy="644" r="7" fill="none" stroke="#c4b5fd" stroke-width="2"/><path d="M89 651v7" stroke="#c4b5fd" stroke-width="2"/>
    <text x="132" y="626" fill="#9c8acf" font-size="12" font-weight="650" letter-spacing="2">CURRENT EXPLORATION</text>
    <text x="132" y="657" fill="#eee8ff" font-size="27" font-weight="650">VaultZero</text>
    <text x="132" y="686" fill="#92a1be" font-size="17">Local-first. Product-minded.</text>
    <path d="m601 637 12 12-12 12m-16-12h27" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="46" y="746" fill="#7886a6" font-size="11" letter-spacing="2" class="mono">DESIGN / BUILD / REFINE</text>
</svg>
